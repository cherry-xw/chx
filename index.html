<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved preference before styles or the application are loaded.
      ;(() => {
        let preference = 'system'
        try {
          preference = localStorage.getItem('chery-theme') || 'system'
        } catch {
          // Storage may be disabled; the system preference still works.
        }
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      html {
        background: #f7f7f9;
      }
      html.dark {
        background: #141419;
      }
    </style>
    <title>無良小萬</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
